<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('hh_theme') || 'dark';
          document.documentElement.classList.add(t);
          document.documentElement.classList.remove(t === 'dark' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>

    <!-- SEO Meta Tags -->
    <title>HashHarbour — Next-Gen EXIM Trade &amp; Logistics Platform</title>
    <meta name="description" content="Streamline container booking, shipment tracking, document management, and global trade operations through one modern logistics platform." />

    <!-- Open Graph -->
    <meta property="og:title" content="HashHarbour — Next-Gen EXIM Trade &amp; Logistics Platform" />
    <meta property="og:description" content="Streamline container booking, shipment tracking, document management, and global trade operations through one modern logistics platform." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Performance: Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Font Loading: Inter + Anton -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Anton&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
